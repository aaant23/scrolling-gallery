<script>
window.addEventListener('load', () => {
  const trackUp = document.getElementById('track-up');
  const trackDown = document.getElementById('track-down');

  if (trackUp && trackDown) {
    const heightUp = trackUp.scrollHeight / 2;
    const heightDown = trackDown.scrollHeight / 2;

    const speedUp = 25;   
    const speedDown = 30; 

    const durationUp = heightUp / speedUp;
    const durationDown = heightDown / speedDown;

    trackUp.style.animationDuration = durationUp + 's';
    trackDown.style.animationDuration = durationDown + 's';
  }
});
</script>

<style>
:root {
  --primary-font: 'Bebas Neue', sans-serif;
}

* {
  box-sizing: border-box;
}

.bala-hero-wrapper {
  position: relative;
  width: 100%;
  height: 650px;
  overflow: hidden;
  background: #0b0b0b;
}

.bala-overlay-text {
  position: absolute;
  top: 50%;
  right: 8%;
  transform: translateY(-50%);
  z-index: 10;
  text-align: left;
  width: 45%;
  max-width: 550px;
  margin-left: -40px;
  pointer-events: none;
}

.bala-overlay-text h1 {
  color: #ffffff;
  font-size: clamp(2.2rem, 4vw, 4rem);
  font-weight: 800;
  line-height: 1.1;
  text-shadow: 0 4px 25px rgba(0,0,0,0.8);
  margin-bottom: 15px;
  font-family: var(--primary-font);
}

.bala-overlay-text p {
  color: #fff;
  font-size: clamp(1.3rem, 1.3rem + 0.9vw, 1.6rem);
  text-shadow: 0 2px 15px rgba(0,0,0,0.8);
  font-family: var(--primary-font);
  margin-bottom: 0;
}

.enquire {
  color: white;
  background-color: #FA2A51;
  font-family: var(--primary-font);
  font-size: 1.3rem;
  display: inline-block;
  padding: 1.2rem 2rem;
  border: none;
  text-decoration: none;
  margin-top: 2rem;
  position: relative;
  pointer-events: auto;
  cursor: pointer;
  transition: opacity 0.2s ease;
}

.enquire:hover {
  opacity: 0.9;
}

.bala-mixed-layout {
  display: grid;
  grid-template-columns: 2fr 1.5fr;
  gap: 20px;
  height: 100%;
  width: 65%;
  position: relative;
  opacity: 0.7;
}

.bala-track-col {
  position: relative;
  overflow: hidden;
  height: 100%;
}

.bala-scroll-track {
  display: flex;
  flex-direction: column;
  position: absolute;
  width: 100%;
  left: 0;
  top: 0;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.bala-scroll-track img {
  width: 100%;
  height: auto;
  max-height: 240px;
  object-fit: cover;
  margin-bottom: 15px;
  border-radius: 0px;
}

.bala-right-column .bala-scroll-track img {
  max-height: none;
  width: 100%;
  height: auto;
  object-fit: contain;
}

.scroll-up {
  animation-name: verticalScrollUp;
}

.scroll-down {
  animation-name: verticalScrollDown;
}

@keyframes verticalScrollUp {
  0% { transform: translateY(0); }
  100% { transform: translateY(-50%); }
}

@keyframes verticalScrollDown {
  0% { transform: translateY(-50%); }
  100% { transform: translateY(0); }
}

/* Mobile responsive fixes to remove phantom gap */
@media (max-width: 768px) {
  .bala-hero-wrapper {
    height: 600px; /* Forces the code block wrapper to collapse properly on mobile */
  }
  .bala-mixed-layout {
    width: 100%;
    opacity: 0.7;
  }
  .bala-overlay-text {
    width: 85%;
    right: auto;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    margin-left: 0;
  }
}
</style>
